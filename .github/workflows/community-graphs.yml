name: Sync community graphs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
  discussions: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update public gallery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-community-graphs.mjs
      - name: Commit changed gallery
        run: |
          if git diff --quiet -- docs/data/community-graphs.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/community-graphs.json
          git commit -m 'Refresh public user graphs'
          git push
